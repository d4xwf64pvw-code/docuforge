<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuForge - Professional Document Generator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Header / Hero Section -->
    <header class="hero">
        <div class="logo-container">
            <img src="assets/logo.svg" alt="DocuForge Logo" class="logo">
            <h1>DocuForge</h1>
        </div>
        <p class="tagline">Generate professional, real-world documents in minutes</p>
        <a href="document.html" class="cta-button">Create a Document</a>
    </header>

    <!-- Document Categories -->
    <section class="categories">
        <h2>Choose a Document Category</h2>
        <div class="category-cards">
            <div class="card">Education</div>
            <div class="card">Business</div>
            <div class="card">Office / HR</div>
            <div class="card">Personal</div>
        </div>
    </section>
    
   <script src="js/main.js"></script>
</body>
</html>
